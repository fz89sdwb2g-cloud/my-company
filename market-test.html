<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Аналіз ринку</title><style>body{font-family:Arial;background:#f5f7fb;color:#20242a;margin:0;padding:18px}.box{max-width:1000px;margin:12px auto;background:white;border:1px solid #dce2ea;border-radius:12px;padding:14px}button,input,select,textarea{padding:9px;margin:4px;border:1px solid #ccd4df;border-radius:8px}.card{border:1px solid #dce2ea;border-radius:10px;padding:12px;margin:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:#667}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="box"><h1>📈 Аналіз ринку — тест відновлення</h1><p>Ізольована перевірка. Дані зберігаються у сумісному ключі <code>myCompanyMarket_v1</code>.</p><button onclick="tab='competitors';render()">Конкуренти</button><button onclick="tab='manufacturers';render()">Виробники</button></div><div class="box"><h3>Додати</h3><div class="row"><input id="name" placeholder="Назва"><input id="phone" placeholder="Контакт"><input id="notes" placeholder="Примітка"><button onclick="addEntity()">Додати</button></div></div><div id="list" class="box"></div><script>const KEY='myCompanyMarket_v1';let tab='competitors';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}};if(!db||typeof db!=='object')db={};db.competitors=Array.isArray(db.competitors)?db.competitors:[];db.manufacturers=Array.isArray(db.manufacturers)?db.manufacturers:[];function save(){localStorage.setItem(KEY,JSON.stringify(db))}function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function addEntity(){let n=document.getElementById('name').value.trim();if(!n)return;db[tab].push({id:Date.now(),name:n,phone:document.getElementById('phone').value.trim(),notes:document.getElementById('notes').value.trim(),products:[],checks:[]});save();document.getElementById('name').value='';render()}function addProduct(id){let n=prompt('Товар');if(!n)return;let u=prompt('Одиниця виміру','шт')||'шт';let x=db[tab].find(x=>x.id===id);x.products=x.products||[];x.products.push({id:Date.now(),name:n,unit:u});save();render()}function addCheck(id){let x=db[tab].find(x=>x.id===id);x.checks=x.checks||[];let prices={};(x.products||[]).forEach(p=>{let v=prompt('Ціна: '+p.name);if(v!==null&&v!=='')prices[p.id]=Number(v)});let next=prompt('Наступна перевірка YYYY-MM-DD','')||'';x.checks.push({id:Date.now(),date:new Date().toISOString().slice(0,10),next,prices});save();render()}function editEntity(id){let x=db[tab].find(x=>x.id===id);let n=prompt('Назва',x.name);if(n===null)return;x.name=n.trim()||x.name;let p=prompt('Контакт',x.phone||'');if(p!==null)x.phone=p;let q=prompt('Примітка',x.notes||'');if(q!==null)x.notes=q;save();render()}function render(){let a=db[tab];document.getElementById('list').innerHTML='<h2>'+(tab==='competitors'?'Конкуренти':'Виробники')+'</h2>'+(a.length?a.map(x=>{let checks=x.checks||[],last=checks[checks.length-1];return '<div class="card"><b>'+e(x.name)+'</b> <span class="small">'+e(x.phone||'')+'</span><p>'+e(x.notes||'')+'</p><div class="row"><button onclick="editEntity('+x.id+')">Редагувати</button><button onclick="addProduct('+x.id+')">+ товар</button><button onclick="addCheck('+x.id+')">+ перевірка цін</button></div><p class="small">Остання: '+e(last?.date||'—')+' • Наступна: '+e(last?.next||'—')+'</p><table><tr><th>Товар</th><th>Од.</th><th>Остання ціна</th></tr>'+((x.products||[]).map(p=>'<tr><td>'+e(p.name)+'</td><td>'+e(p.unit)+'</td><td>'+(last?.prices?.[p.id]??'—')+'</td></tr>').join(''))+'</table><details><summary>Історія перевірок ('+checks.length+')</summary>'+checks.map(c=>'<p>'+e(c.date)+' → наступна '+e(c.next||'—')+' | '+e(JSON.stringify(c.prices||{}))+'</p>').join('')+'</details></div>'}).join(''):'<p>Записів немає.</p>')}render()</script></body></html>
