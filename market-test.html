<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Аналіз ринку</title><style>body{font-family:Arial;background:#f5f7fb;color:#20242a;margin:0;padding:18px}.box{max-width:1000px;margin:12px auto;background:white;border:1px solid #dce2ea;border-radius:12px;padding:14px}button,input,select,textarea{padding:9px;margin:4px;border:1px solid #ccd4df;border-radius:8px}.card{border:1px solid #dce2ea;border-radius:10px;padding:12px;margin:10px 0}.row{display:flex;gap:6px;flex-wrap:wrap}.small{font-size:12px;color:#667}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="box"><h1>📈 Аналіз ринку — тест відновлення</h1><p>Ізольована перевірка. Дані зберігаються у сумісному ключі <code>myCompanyMarket_v1</code>.</p><button data-tab="competitors">Конкуренти</button><button data-tab="manufacturers">Виробники</button></div><div class="box"><h3>Додати</h3><div class="row"><input id="name" placeholder="Назва"><input id="phone" placeholder="Контакт"><input id="notes" placeholder="Примітка"><button id="addEntity">Додати</button></div></div><div class="box"><p id="storageNotice" role="alert"></p><button id="exportMarket">Зберегти резервну копію</button><label>Відновити з копії <input id="importMarket" type="file" accept="application/json,.json"></label></div><div id="list" class="box"></div><script src="modules/safe-store.js"></script><script src="modules/market-restored.js"></script></body></html>
